name: Build OpenInverterGateway firmware

on:
  workflow_dispatch:
    inputs:
      hardware:
        description: "Target hardware"
        required: true
        type: choice
        default: ShineWifiX
        options:
          - ShineWifiX
          - ShineWifiS
          - d1
          - nodemcu-32s
          - lolin32
      protocol:
        description: "Growatt Modbus protocol (check inverter model first)"
        required: true
        type: choice
        default: "124"
        options:
          - "120"
          - "124"
          - "305"
          - "3000"
          - "5000"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install "platformio>=6,<7"

      - name: Create build configuration
        env:
          GROWATT_PROTOCOL: ${{ inputs.protocol }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path("SRC/ShineWiFi-ModBus/Config.h.example")
          target = source.with_name("Config.h")
          configuration = source.read_text(encoding="utf-8")
          configuration, count = re.subn(
              r"(?m)^#define GROWATT_MODBUS_VERSION\s+\d+\s*$",
              f"#define GROWATT_MODBUS_VERSION {os.environ['GROWATT_PROTOCOL']}",
              configuration,
          )
          if count != 1:
              raise SystemExit("Could not set Growatt protocol in Config.h.example")
          target.write_text(configuration, encoding="utf-8")

          # The upstream project references this optional local configuration.
          pathlib.Path("platformio-local.ini").touch(exist_ok=True)
          PY

      - name: Compile firmware
        env:
          PIO_ENV: ${{ inputs.hardware }}
        run: pio run -e "$PIO_ENV"

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: openinvertergateway-${{ inputs.hardware }}-protocol-${{ inputs.protocol }}
          path: .pio/build/${{ inputs.hardware }}/firmware.bin
          if-no-files-found: error
          retention-days: 30
